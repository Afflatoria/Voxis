[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-tts"
version = "0.1.0"
description = "Local real-time configurable neural TTS with streaming inference"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Voice Research" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0,<2.0",
    "soundfile>=0.12.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
download = [
    "huggingface_hub>=0.23.0",
]
f5tts = [
    "f5-tts>=1.1.22",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.12.0",
    "soundfile>=0.12.1",
]

[project.scripts]
neural-tts = "neural_tts.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
